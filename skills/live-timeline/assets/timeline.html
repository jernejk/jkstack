<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live timeline</title>
<link rel="icon" href="data:,">
<meta name="description" content="A long-running task told as a story: chapters, breakthroughs, dead ends, blockers and nudges, updated live from live/events.json.">
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf9; --card-2:#f1eee6; --ink:#1d1f24; --muted:#6b6f78; --faint:#a3a6ad; --line:#e3ded3; --line-2:#d3ccbe;
  --accent:#b4471f; --now:#d23a2a; --focus:#2563eb; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 24px rgba(40,30,10,.06);
  --k-start:#2563eb; --k-update:#8a919e; --k-success:#15803d; --k-breakthrough:#c88a04; --k-fail:#dc2626;
  --k-nudge:#c026d3; --k-decision:#6d28d9; --k-review:#0f766e; --k-spend:#a0612a; --k-sealed:#1e293b; --k-blocked:#ea580c;
  --kfg:#ffffff; --good:#15803d; --bad:#dc2626; --warn:#d97706;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --card:#171a1f; --card-2:#1d2128; --ink:#e9e6df; --muted:#9a9ea7; --faint:#666b75; --line:#262a31; --line-2:#323741;
    --accent:#f08a5d; --now:#ff6b5b; --focus:#7aa2ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
    --k-start:#6ea8fe; --k-update:#7d8594; --k-success:#4ade80; --k-breakthrough:#fbc531; --k-fail:#f87171;
    --k-nudge:#e879f9; --k-decision:#a78bfa; --k-review:#2dd4bf; --k-spend:#d9a066; --k-sealed:#e2e8f0; --k-blocked:#fb923c;
    --kfg:#101215; --good:#4ade80; --bad:#f87171; --warn:#fbbf24; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --card:#171a1f; --card-2:#1d2128; --ink:#e9e6df; --muted:#9a9ea7; --faint:#666b75; --line:#262a31; --line-2:#323741;
  --accent:#f08a5d; --now:#ff6b5b; --focus:#7aa2ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  --k-start:#6ea8fe; --k-update:#7d8594; --k-success:#4ade80; --k-breakthrough:#fbc531; --k-fail:#f87171;
  --k-nudge:#e879f9; --k-decision:#a78bfa; --k-review:#2dd4bf; --k-spend:#d9a066; --k-sealed:#e2e8f0; --k-blocked:#fb923c;
  --kfg:#101215; --good:#4ade80; --bad:#f87171; --warn:#fbbf24; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.sym{display:block;overflow:visible}

/* Header */
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(20px,3.2vw,28px);line-height:1.15;margin:2px 0 0;letter-spacing:-.01em}
.tools{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.feed{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.feed .pulse{position:relative;width:8px;height:8px;border-radius:50%;background:var(--k-success)}
.feed .pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.4s ease-out infinite}
.feed.stale .pulse,.feed.is-quiet .pulse{background:var(--warn)}
.feed.bad .pulse{background:var(--k-fail)}
.feed.stale .pulse::after,.feed.bad .pulse::after,.feed.is-quiet .pulse::after{animation:none}
.feed.stale,.feed.bad,.feed.is-quiet{color:var(--ink)}
/* Looping effects move only transform and opacity, so the compositor runs them; :root.is-resting pauses them when nobody is looking. */
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes breathe{50%{transform:scale(.7);opacity:.45}}
:root.is-resting .feed .pulse::after,:root.is-resting .runners span::before,:root.is-resting .tone,:root.is-resting .halo,:root.is-resting .pill.run::before{animation-play-state:paused}
.iconbtn{border:1px solid var(--line-2);background:var(--card);border-radius:8px;height:30px;min-width:30px;padding:0 8px;cursor:pointer;font-size:12px;color:var(--muted)}
.iconbtn:hover{color:var(--ink)}

.strip{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.cell{background:var(--card);padding:10px 12px;min-width:0;text-align:left;border:0;display:block;width:100%}
button.cell{cursor:pointer}
button.cell:hover{background:var(--card-2)}
.cell .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.cell .val{font-weight:600;font-size:13.5px;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .sub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-status .sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.bar-lbl{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.bar-lbl b{color:var(--ink);font-weight:650}
.big{font-size:20px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font-size:12px;font-weight:500;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--card-2);margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent);transition:width .8s ease}
.bar i+i{opacity:.65}.bar i+i+i{opacity:.4}
.runners{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.runners span{display:inline-flex;align-items:center;gap:4px}
.runners span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k-success);animation:breathe 2.4s ease-in-out infinite}
.tone{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
.tone.good{background:var(--good)}.tone.warn{background:var(--warn)}.tone.bad{background:var(--bad);animation:breathe 2.4s ease-in-out infinite}.tone.done{background:var(--k-start)}
.c-block{background:color-mix(in srgb,var(--k-blocked) 10%,var(--card))}
button.c-block:hover{background:color-mix(in srgb,var(--k-blocked) 16%,var(--card))}
.c-block .lbl{color:var(--k-blocked)}
.count{font-size:10.5px;font-weight:700;border-radius:99px;padding:0 6px;background:var(--k-blocked);color:var(--kfg)}

/* Cards and sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ribbon,.metrics{margin-top:12px;padding:10px 12px 8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rib-body{position:relative;width:100%}
.rib-body svg{display:block;width:100%;height:auto}
.rib-lane{font-size:11px;fill:var(--muted);font-weight:550}
.rib-band{fill:var(--card-2);opacity:.55}
.rib-tick line{stroke:var(--line);stroke-width:1}
.rib-tick.day line{stroke:var(--line-2)}
.rib-tick text{font-size:10px;fill:var(--faint);font-variant-numeric:tabular-nums}
.rib-arc{fill:none;stroke-width:1.3;opacity:.3;transition:opacity .2s,stroke-width .2s}
.rib-arc.long{opacity:.08}
.rib-arc.hot{opacity:.95;stroke-width:2.2}
.rib-run{stroke-width:2.5;stroke-dasharray:3 4;opacity:.7}
.rib-run.blk{stroke-width:3;opacity:.85}
.rib-now line{stroke:var(--now);stroke-width:1.5}
.rib-now text{font-size:10px;font-weight:700;fill:var(--now)}
.mk{cursor:pointer;outline:none}
.mk .hit{fill:transparent}
.mk:focus-visible .hit{stroke:var(--focus);stroke-width:2}
.mk-in{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.mk:hover .mk-in{transform:scale(1.25)}
.mk.pop .mk-in{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.halo{opacity:.2;animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.18}50%{opacity:.34}}
.rib-gap rect{fill:var(--card-2);stroke:var(--line-2);stroke-dasharray:2 2}.rib-gap path{fill:none;stroke:var(--faint);stroke-width:1}.rib-gap text{font-size:9.5px;fill:var(--faint)}
.rib-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.rib-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 8px;border-radius:7px;max-width:260px;box-shadow:var(--shadow)}
.tip b{display:block;font-weight:600}
.tip span{opacity:.75}

/* Metrics */
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:6px}
.m-card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);min-width:0}
.m-name{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:2px}
.m-val{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.m-delta{font-size:11.5px;font-weight:600;white-space:nowrap}
.m-delta.up{color:var(--good)}.m-delta.down{color:var(--bad)}.m-delta.flat{color:var(--muted)}
.m-foot{font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:100%;height:26px;margin-top:4px}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.6}

/* Story */
.story{max-width:760px;margin:26px auto 0}
.chapter{margin:0 0 34px;animation:fadeup .6s ease both;scroll-margin-top:56px}
.ch-head{display:grid;grid-template-columns:44px 40px 1fr;align-items:start;padding-bottom:14px;position:relative}
.ch-head::before{content:"";position:absolute;left:63px;top:30px;bottom:0;width:2px;background:var(--line-2);opacity:.6}
.ch-n{grid-column:2;grid-row:span 3;justify-self:center;display:grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line-2));background:var(--bg);font-family:var(--serif);font-size:15px;font-weight:600;color:var(--accent);position:relative;z-index:1}
.ch-span{grid-column:3;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:1px}
.ch-span::after{content:"";flex:1;height:1px;background:var(--line)}
.ch-head h2{grid-column:3;font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.15;margin:2px 0 0;letter-spacing:-.015em;text-wrap:balance}
.ch-live{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--now);border:1px solid currentColor;border-radius:99px;padding:0 7px;line-height:16px}
.ch-sum{grid-column:3;margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.5;max-width:60ch;text-wrap:pretty}
.beats{list-style:none;margin:0;padding:0;position:relative}
.beats::before{content:"";position:absolute;left:63px;top:0;bottom:6px;width:2px;background:var(--line-2);border-radius:2px}
.beat{display:grid;grid-template-columns:44px 40px 1fr;align-items:start;margin:0 0 7px}
.imp2 .b-card{box-shadow:none}
.imp2 .b-sum{font-size:13px}
.b-time{font-size:12px;color:var(--muted);text-align:right;padding-top:12px;padding-right:2px;font-variant-numeric:tabular-nums;line-height:1.25}
.b-time small{display:block;font-size:10px;color:var(--faint)}
.b-mark{display:flex;justify-content:center;padding-top:9px;position:relative;z-index:1}
.b-mark .sym{width:22px;height:22px;filter:drop-shadow(0 0 3px var(--bg))}
.imp3 .b-mark{padding-top:8px}
.imp3 .b-mark .sym{width:28px;height:28px}
.b-card{display:block;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 12px 9px;box-shadow:var(--shadow);transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.b-card:hover{border-color:color-mix(in srgb,var(--kc) 55%,var(--line));transform:translateY(-1px)}
.b-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc);opacity:.9}
.imp2 .b-card::before{opacity:.55}
.b-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11px;color:var(--faint)}
.b-tm{display:none;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.b-kind{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;color:var(--kc)}
.pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:1px 7px;background:color-mix(in srgb,var(--k-start) 15%,transparent);color:var(--k-start)}
.pill.blk{background:color-mix(in srgb,var(--k-blocked) 16%,transparent);color:var(--k-blocked)}
.pill.new{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.pill.run::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.b-card h3{margin:3px 0 0;font-size:15px;line-height:1.3;font-weight:650;letter-spacing:-.005em}
.imp3 .b-card h3{font-family:var(--serif);font-size:18px;font-weight:600}
.b-sum{margin:3px 0 0;color:var(--ink);opacity:.86;font-size:13.5px}
.b-why{margin:6px 0 0;font-size:13px;color:var(--muted);font-style:italic;padding-left:10px;border-left:2px solid var(--line-2)}
.b-imgs,.m-imgs{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:10px;margin-top:10px;max-width:calc(var(--n,1) * 220px)}
.imp3 .b-imgs{max-width:calc(var(--n,1) * 300px)}
.b-imgs.cmp{max-width:540px}.imp3 .b-imgs.cmp{max-width:none}
.m-imgs,.m-imgs.cmp{max-width:none;margin-top:0}
.shot{margin:0;min-width:0;position:relative}
.frame{display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);background:var(--card-2);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.m-imgs .frame img{object-fit:contain;background:#0b0c0e}
.shot figcaption{display:flex;align-items:center;gap:6px;min-height:17px;margin-top:5px;font-size:11.5px;color:var(--muted);min-width:0}
.shot figcaption span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot figcaption b{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink);flex-shrink:0}
.cmp .shot:first-child figcaption b{color:var(--muted)}
.cmp .shot:first-child .frame{opacity:.88}
.cmp .shot+.shot::before{content:"→";position:absolute;z-index:1;left:-16px;top:0;width:22px;height:22px;margin-top:calc(28.125% - 11px);display:grid;place-items:center;border-radius:50%;background:var(--card);border:1px solid var(--line-2);color:var(--kc);font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.m-imgs a{text-decoration:none}
.m-imgs a:hover .frame{border-color:var(--kc)}
.b-nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.b-nums div,.nums div{background:var(--card-2);border-radius:8px;padding:4px 10px 5px;min-width:0}
.b-nums dt,.nums dt{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.b-nums dd,.nums dd{margin:0;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;line-height:1.3}
.was{color:var(--muted);font-weight:500}
.to{color:var(--kc);margin:0 4px;font-weight:600}
.b-foot{display:flex;gap:8px;margin-top:7px;font-size:11.5px;color:var(--faint)}
.b-meta .more{margin-left:auto;color:var(--accent);font-weight:600;white-space:nowrap;opacity:.7}
.b-card:hover .more{opacity:1}
.b-from{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-breakthrough.imp3 .b-card{background:linear-gradient(135deg,color-mix(in srgb,var(--k-breakthrough) 14%,var(--card)) 0%,var(--card) 55%);border-color:color-mix(in srgb,var(--k-breakthrough) 45%,var(--line))}
.k-blocked.open .b-card{background:linear-gradient(135deg,color-mix(in srgb,var(--k-blocked) 12%,var(--card)) 0%,var(--card) 60%);border-color:color-mix(in srgb,var(--k-blocked) 50%,var(--line))}
.k-sealed .b-card{background:repeating-linear-gradient(135deg,var(--card) 0 10px,var(--card-2) 10px 11px)}
.quiet{display:none;grid-template-columns:44px 40px 1fr;align-items:center;margin:0 0 3px;font-size:12px;color:var(--muted)}
.chapter.show-quiet .quiet{display:grid}
.q-time{text-align:right;padding-right:2px;font-variant-numeric:tabular-nums;color:var(--faint)}
.q-dot{display:flex;justify-content:center;position:relative;z-index:1}
.q-dot i{width:9px;height:9px;border-radius:50%;background:var(--kc);box-shadow:0 0 0 3px var(--bg)}
.q-text{border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-text b{color:var(--ink);font-weight:600}
.q-text .b-tm{margin-right:6px}
.q-text:hover{color:var(--ink)}
.q-toggle{margin:2px 0 0 96px;border:0;background:none;color:var(--faint);font-size:12px;cursor:pointer;padding:2px 0}
.q-toggle:hover{color:var(--ink)}
.q-toggle .dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:1px}
.q-toggle .dots i{width:5px;height:5px;border-radius:50%;background:var(--kc,var(--faint))}

.enter{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.enter .b-mark .sym{animation:pop .7s .1s cubic-bezier(.2,1.6,.4,1) both}
.enter .b-card{animation:flash 2.6s .2s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--kc) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.burst{position:absolute;left:50%;top:21px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--k-breakthrough);animation:burst 1.1s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* Views, lanes and models */
.viewbar{position:sticky;top:0;z-index:15;max-width:760px;margin:22px auto 0;padding:8px 0;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.jump::-webkit-scrollbar{display:none}
.jump button{flex-shrink:0;border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.jump button b{font-family:var(--serif);color:var(--accent);margin-right:5px;font-weight:600}
.jump button:hover,.jump button.here{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 50%,var(--line-2))}
.story{margin-top:10px}
.run-digest{margin:0 0 30px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;box-shadow:var(--shadow)}
.run-digest h2{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.run-digest p{margin:0 0 4px;font-family:var(--serif);font-size:16px;line-height:1.45}
.ch-story{margin:-4px 0 0 96px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ch-digest{margin:0;font-size:14.5px;line-height:1.55;max-width:62ch;text-wrap:pretty}
.ch-outcome{margin:0;font-size:13px;color:var(--muted)}
.ch-outcome b{color:var(--ink);font-weight:650}
.ch-hero{display:block;max-width:420px;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.ch-hero .frame{aspect-ratio:16/10}
.keys{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.keys button{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px 5px 6px;cursor:pointer;text-align:left;min-width:0}
.keys button:hover{border-color:color-mix(in srgb,var(--kc) 55%,var(--line))}
.keys .sym{width:18px;height:18px;flex-shrink:0}
.keys .kt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.keys .kx{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-more{margin:8px 0 0 96px;border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.ch-more:hover{color:var(--ink)}
.b-model{font-weight:600;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:0 6px;font-size:10.5px}
.b-choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.b-choices span{border:1px solid color-mix(in srgb,var(--k-blocked) 45%,var(--line-2));color:var(--ink);border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:550;background:var(--card)}
.t3link{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-weight:600;font-size:12px;white-space:nowrap}
.t3link::after{content:"↗";font-size:11px}
a.iconbtn{display:inline-flex;align-items:center;text-decoration:none}
.cellwrap{position:relative;background:var(--card);min-width:0}
.cellwrap>.cell{height:100%}
.cellwrap>.t3link{position:absolute;right:10px;top:9px;font-size:11px}
.c-block+.t3link{color:var(--k-blocked)}
.lanes{margin-top:12px;padding:10px 12px 10px}
.l-list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.l-row{display:grid;grid-template-columns:14px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.6fr) auto;align-items:center;gap:10px;background:var(--card);padding:6px 10px;font-size:12.5px}
.l-row .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-row .md2,.l-row .st{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-row .st b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block}
.dot.on{background:var(--k-success);animation:breathe 2.4s ease-in-out infinite}
:root.is-resting .dot.on{animation-play-state:paused}
.mo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.mo{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.mo-n{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:650;font-size:13.5px}
.mo-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.mo-bar{height:4px;border-radius:2px;background:var(--accent);opacity:.7;margin-top:5px}
.mo details{margin-top:4px;font-size:12px}
.mo summary{cursor:pointer;color:var(--muted)}
.mo ul{margin:4px 0 0;padding-left:16px}
.mo li{margin:1px 0}
.rib-span{stroke-width:2;opacity:.45;stroke-linecap:round}
.rib-note{font-size:12px;color:var(--muted);margin:2px 0 4px}
.rib-note button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.m-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m-chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.m-chip b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.m-all{margin-top:8px}
.frame.tall img{object-fit:contain;object-position:center}
.shot .more-n{position:absolute;right:6px;top:6px;background:rgba(10,12,16,.72);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}

.empty{color:var(--muted);text-align:center;padding:40px 0}
.foot{max-width:760px;margin:10px auto 0;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px}

.latest{position:fixed;right:16px;bottom:16px;z-index:20;border:0;border-radius:99px;padding:8px 14px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;animation:fadeup .3s ease both}

/* Popup */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}

.backdrop{position:absolute;inset:0;background:rgba(10,12,16,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease both}

@keyframes fade{from{opacity:0}}

.sheet h3{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2;margin:12px 0 4px;letter-spacing:-.01em}
.lead{font-size:14.5px;margin:0}
.why{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--kc);background:var(--card-2);border-radius:0 8px 8px 0;font-size:13.5px}
.why b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.msec{margin-top:14px}
.msec>h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.md{font-size:13.5px}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:18px}.md li{margin:2px 0}
.md code{font-family:var(--mono);font-size:12px;background:var(--card-2);padding:1px 4px;border-radius:4px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:0}
.nums div{padding:6px 10px 7px}
.nums dd{font-size:17px}
.links{margin:0;padding:0;list-style:none}
.links li{margin:3px 0;font-size:13px}
.links a{font-weight:550}
.links code{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:3px 10px 3px 5px;font-size:12px;cursor:pointer;max-width:100%}
.chip .sym{width:16px;height:16px;flex-shrink:0}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--kc)}
.chip.old{opacity:.6;text-decoration:line-through}
.m-nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.m-nav button{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-nav button:hover{color:var(--ink)}
.m-nav button:disabled{visibility:hidden}
.upd textarea{width:100%;min-height:300px;margin-top:10px;border:1px solid var(--line-2);border-radius:10px;background:var(--card-2);color:var(--ink);font:12.5px/1.5 var(--mono);padding:10px;resize:vertical}
.upd .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.upd .hint{font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .strip{grid-template-columns:1fr 1fr!important}
  .strip{grid-auto-flow:dense}
  .strip .wide{grid-column:span 2}
  .titlebar{align-items:flex-start;flex-direction:column}
  .tools{justify-content:flex-start}
  .ch-head,.beat{grid-template-columns:0 32px 1fr}
  .ch-head{column-gap:10px}
  .quiet{grid-template-columns:0 32px 1fr}
  .ch-n{min-width:30px;height:30px;font-size:13.5px}
  .beats::before,.ch-head::before{left:15px}
  .b-time,.q-time{display:none}
  .b-mark,.q-dot{grid-column:2}
  .b-tm{display:inline}
  .q-toggle{margin-left:32px}
  .b-card{padding:8px 11px 10px}
  .b-imgs{gap:8px;max-width:none}
  .b-imgs:not(.cmp){grid-template-columns:repeat(min(var(--n,1),2),minmax(0,1fr))}
  .m-imgs.cmp{grid-template-columns:1fr;gap:14px}
  .m-imgs.cmp .shot+.shot::before{content:"↓";left:50%;top:-18px;margin:0 0 0 -11px}
  .seg button{padding:4px 8px}
  .viewbar{flex-wrap:wrap;gap:8px}
  .jump{flex-basis:100%}
  .ch-story,.ch-more{margin-left:42px}
  .l-row{grid-template-columns:14px auto minmax(0,1fr) auto;row-gap:0}
  .l-row .st{grid-column:2 / span 3;font-size:11.5px}
  .chapter{scroll-margin-top:92px}
  .ch-head h2{font-size:21px}
  .ch-sum{font-size:13.5px}
  .imp3 .b-card h3{font-size:17px}
  .modal{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding:14px 16px 24px;animation-name:sheetup}
  @keyframes sheetup{from{transform:translateY(40px);opacity:.4}}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

(() => {
'use strict';
const FEED = 'live/events.json';
const STORE = 'live-timeline:' + location.pathname + ':';
const KINDS = {
  start:        { label: 'Started' },
  update:       { label: 'Update' },
  success:      { label: 'Success' },
  breakthrough: { label: 'Breakthrough' },
  fail:         { label: 'Dead end' },
  blocked:      { label: 'Needs you' },
  nudge:        { label: 'Nudge' },
  decision:     { label: 'Decision' },
  review:       { label: 'Review finding' },
  spend:        { label: 'Spend' },
  sealed:       { label: 'Sealed' }
};
const ALIAS = { orchestrator: 'decision', blocker: 'blocked' };
const BLOCKED_LINK = /(^|\/)private\/|^\/|^~|^file:|\.\.\//i;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = {
  get(k) { try { return localStorage.getItem(STORE + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(STORE + k, v); } catch {} }
};
const H = 3600e3;
let tz, tf, df, dayKey;
function setTz(zone) {
  const opt = z => { try { new Intl.DateTimeFormat('en-AU', { timeZone: z }); return z; } catch { return undefined; } };
  tz = zone ? opt(zone) : undefined;
  tf = new Intl.DateTimeFormat('en-AU', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
  df = new Intl.DateTimeFormat('en-AU', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short' });
  dayKey = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' });
}
setTz();
let multiDay = false;
const hm = t => tf.format(new Date(t));
const day = t => df.format(new Date(t));
