.m-story .md2.good{color:var(--k-success)} .m-story .md2.bad{color:var(--k-fail)}
.m-story .h2s{display:block;margin:26px 0 8px}
.m-story .singles{list-style:none;margin:0;padding:0;columns:2;column-gap:36px}
.m-story .singles li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;break-inside:avoid}
@media (max-width:820px){
.m-story .wrap{padding:14px 22px 56px}
.m-story .hero{grid-template-columns:minmax(0,1fr);gap:26px}
.m-story .why,.m-story .outs,.m-story .calls{grid-template-columns:minmax(0,1fr)}
.m-story .lh{display:flex;flex-wrap:wrap;gap:4px 12px}
.m-story .ln{flex:1;min-width:0}
.m-story .heat{flex-basis:100%;order:9}
.m-story .lst:nth-of-type(5),.m-story .lst:nth-of-type(6){display:none}
}
@media (max-width:699px){
.m-story .wrap{padding:12px 16px 48px}
.m-story .mast h1{font-size:29px;margin-top:4px}
.m-story .lede{font-size:15.5px}
.m-story .top h1{display:none}
.m-story .pill.done .ps{display:none}
.m-story .hero-l,.m-story .hero-r{display:contents}
.m-story .hero>*>*{min-width:0}
.m-story .hero>*>.ask{order:0} .m-story .nowbox{order:1} .m-story .digest{order:2}
.m-story .arcbox{order:3} .m-story .facts{order:4} .m-story .film{order:5}
.m-story .digest p{font-size:17.5px}
.m-story .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.m-story .hsub{display:block;margin:2px 0 0}
.m-story .arc-cap{flex-wrap:wrap}
.m-story .arc-cap .cap{flex-basis:calc(100% - 100px)}
.m-story .chh{grid-template-columns:26px minmax(0,1fr) 20px;gap:4px 8px}
.m-story .cm{grid-column:2/3;grid-row:2;flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 12px;white-space:normal}
.m-story .chev{grid-column:3;grid-row:1}
.m-story .cn{font-size:19px}
.m-story .chb{padding-left:0}
.m-story .chap.open{margin:6px -10px;padding:0 10px}
.m-story .bh{flex-wrap:wrap;gap:2px 10px}
.m-story .bb{flex-basis:calc(100% - 30px)}
.m-story .bm{flex-basis:100%;flex-direction:row;gap:10px;padding-left:26px}
.m-story .bd{padding-left:14px}
.m-story .q{min-height:40px;flex-basis:100%}
.m-story .singles{columns:1}
.m-story .tabs{margin:24px -16px 0;padding:6px 10px 0}
}

        const wins = r.events.filter(e => e.outcome === 'worked').length, fl = r.events.filter(e => e.kind === 'fail').length, open = S.more.has(r.id);
        return `<div class="lrow ${open ? 'open' : ''}" data-row="${esc(r.id)}"><button class="lh" data-act="more" data-id="${esc(r.id)}" aria-expanded="${open}">
          <span class="ln"><b>${r.active ? '<i class="dot"></i>' : ''}${esc(r.name)}</b><span class="mut">${esc(r.sub)}</span></span>
          <span class="heat" aria-hidden="true">${R.chapters.map(c => { const k = r.events.filter(e => e.C === c).length; return `<i style="opacity:${k ? (.25 + .75 * k / mx).toFixed(2) : 0}"></i>`; }).join('')}</span>
          <span class="lst num"><b>${r.events.length}</b> beats</span><span class="lst num"><b>${wins}</b> landed</span><span class="lst num"><b>${fl}</b> dead ends</span><span class="lst num"><b>${r.starts.length}</b> start${r.starts.length === 1 ? '' : 's'}${r.worked > 6e4 ? ', <b>' + fmt.dur(r.worked) + '</b>' : ''}</span>
          <span class="chev">${open ? ICON.up : ICON.down}</span></button>
          ${open ? `<div class="lb">${r.t3 ? `<p><a class="t3link" href="${esc(r.t3)}">Open the lane in T3</a></p>` : ''}${r.what ? `<p class="mut">${r.what}</p>` : ''}${r.keys.length ? r.keys.map(e => beat(e)).join('') : '<p class="mut">No milestones here; the lane did supporting work.</p>'}</div>` : ''}</div>`;
      }).join('')}</div>`;
  }
  function measures() {
    const multi = R.metrics.filter(m => m.points.length > 1), single = R.metrics.filter(m => m.points.length === 1);
    return `<div class="meas">${multi.map(m => { const d = LT.metricDelta(m); return `<div class="mc"><span class="mn">${esc(m.name)}</span><span class="mv num">${esc(fmt.num(m.lastP))}</span>${LT.sparkline(m.points, 120, 34)}
      <span class="md2 num ${d && d.good === true ? 'good' : d && d.good === false ? 'bad' : ''}">${d ? d.text : ''} <span class="mut">from ${esc(fmt.num(m.first))} over ${m.points.length} readings${m.lastP.note ? ', ' + esc(m.lastP.note) : ''}</span></span></div>`; }).join('')}</div>
      <h2 class="h2s">Single readings</h2><ul class="singles">${single.map(m => `<li><span>${esc(m.name)}${m.L ? ` <span class="mut">${esc(m.L.short)}</span>` : ''}</span><b class="num">${esc(fmt.num(m.lastP))}</b></li>`).join('')}</ul>`;
  }
  function view(keep) {
    const v = $('.view'), y = scrollY;
    v.innerHTML = ({ story, why, out: outcomes, calls, lanes, meas: measures })[S.tab]();
    v.dataset.tab = S.tab;
    const q = $('.view .q');
    if (q) q.addEventListener('input', ev => { S.q = ev.target.value; const pos = ev.target.selectionStart; view(true); const n = $('.view .q'); n.focus(); n.setSelectionRange(pos, pos); });
    if (keep) scrollTo(0, y);
  }
  function reveal(id) {
    const e = R.by[id]; if (!e || !e.L) return;
    LT.hashTo(id);
    S.tab = 'story'; S.q = ''; S.beat = id;
    if (e.C) { S.open.add(e.C.id); if (!e.C.key.includes(e)) S.all.add(e.C.id); S.ch = e.C.id; }
    tabs(); view(); arc();
    const n = document.getElementById('b-' + id); if (n) n.scrollIntoView({ block: 'center' });
  }
  function onAct(a, t) {
    const id = t.dataset.id;
    if (a === 'tab') { S.tab = id; S.beat = null; tabs(); view(); const tb = $('.tabs'), v = $('.view'); if (v.getBoundingClientRect().top < tb.offsetHeight) scrollTo(0, scrollY + v.getBoundingClientRect().top - tb.offsetHeight); return; }
    if (a === 'beat') { S.beat = S.beat === id ? null : id; return view(true); }
    if (a === 'chap') { S.open.has(id) ? S.open.delete(id) : S.open.add(id); S.ch = id; arc(); return view(true); }
    if (a === 'allbeats') { S.all.has(id) ? S.all.delete(id) : S.all.add(id); return view(true); }
    if (a === 'openall') { if (S.open.size >= R.chapters.length) S.open.clear(); else R.chapters.forEach(c => S.open.add(c.id)); return view(true); }
    if (a === 'every') { S.every = t.dataset.v === '1'; return view(true); }
    if (a === 'order') { S.order = t.dataset.o; LT.ls.set('order', S.order); return view(true); }
    if (a === 'more') { S.more.has(id) ? S.more.delete(id) : S.more.add(id); return view(true); }
    if (a === 'group') { S.group = t.dataset.v; return view(true); }
    if (a === 'reveal') return reveal(id);
    if (a === 'readch') { S.tab = 'story'; S.q = ''; S.open.add(id); tabs(); view(); const n = document.getElementById('c-' + id); if (n) n.scrollIntoView({ block: 'start' }); return; }
    if (a === 'chstep') return step(+t.dataset.d);
  }
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => on() && arc(), 120); });
  LT.register('story', { render, refresh, onAct, onEvent: id => reveal(id) });
})();
LT.boot();
</script>
</body>
